<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esfera!</title>
    <link rel="stylesheet" href="esfera-cilindro.css">
</head>
<body>

    <h1> Calculadora da Esfera </h1>

    <div class="caixa">
        <label for="raio">Raio esfera:</label>
            <input type="number" id="raio" step="any" min="0"> 
            <button type="button" onclick="calcularEsfera()">calcular</button>
    </div>

    <div class="caixa" id="resultado">
        <p> Tipo da Figura: <span id="tipo"></span> </p>
        <p> Diâmetro: <span id = "diametro"></span> </p>
        <p> Área: <span id="area"></span> </p>
        <p> Volume: <span id="volume"></span> </p>
    </div>


    <script src="esfera.js"></script>
</body>
</html>
