<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciliro</title>
     <link rel="stylesheet" href="esfera-cilindro.css">
</head>
<body>

     <h1> Calculadora do Cilindro </h1>

    <div class="caixa">
        <label for="raio">Raio cilindro:</label>
        <input type="number" id="raio" step="any" min="0">
        <br>
        
        <label for="altura">Altura cilindro:</label>
        <input type="number" id="altura" step="any" min="0">

            <button type="button" onclick="calcularCilindro()">calcular</button>
    </div>

    <div class="caixa" id="resultado">
        <p> Tipo da Figura: <span id="tipo"></span> </p>
       
        <p> Área: <span id="area"></span> </p>
        <p> Área Lateral: <span id = "areaLateral"></span> </p>
        <p> Volume: <span id="volume"></span> </p>
    </div>


    <script src="cilindro.js"></script>
    
</body>
</html>
