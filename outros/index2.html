<!DOCTYPE html> <!-- Declara HTML5 -->

<html lang="en"> <!-- Idioma -->

<!-- Cabeçalho (head = informações da página;
     não confundir com <header>, que é o cabeçalho VISÍVEL) -->
<head>
    <meta charset="UTF-8"> <!-- Define caractere -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura como a página se comporta -->
    <title>Document</title> <!-- Título -->
</head>

<body> <!-- Inicia o corpo -->

    <!-- TÍTULOS: h1 é o maior/mais importante, h6 o menor/menos importante -->
    <h1>Oi</h1>
    <h2>Oi</h2>
    <h3>Oi</h3>
    <h4>Oi</h4>
    <h5>Oi</h5>
    <h6>Oi</h6>

    <!-- <p> = parágrafo (cada um começa em nova linha, com espaço entre eles) -->
    <p>O jorge adora rapazes</p>
    <p>Jorge todo estranho</p>

    <!-- Lorem ipsum = texto de exemplo para preencher espaço (no VS Code: digite "lorem" + Tab) -->
    <P>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Corporis temporibus modi eaque nostrum asperiores molestias laboriosam excepturi cupiditate culpa ipsum facilis vero tempora minus, eius cumque possimus animi ipsam. Non?</P>

</body>

</html> <!-- Finaliza o HTML -->
