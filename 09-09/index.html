<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="codigo.js" method="post"> <!--tag de formulário--> <!--action -> manda alguem tratar--> <!--method = como serão enviados-->
       
        <fieldset style="border-color: black;">
            <legend>Dados pessoais</legend>
            <label for="nome"> <!--ID/ligação -->
                    Nome Completo
            </label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" minlength="4" maxlength="50" required> <!--placeholder = dica para o usuário--> <!--minlength = tamanho mínimo--> <!--maxlength = tamanho máximo--> <!--required = obrigatório-->
            <br> <br>
            <label for="email">
                    E-mail
            </label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            <br> <br>
            <label for="data">
                    Data de Nascimento
            </label>
            <input type="date" id="data" name="data" required>
            <br> <br>
        </fieldset>

        <fieldset style="border-color: black;">
             <legend>Endereços</legend>
                <label for="UF">UF</label>
                <select name="" id="uf">
                    <option value="" selected disabled></option> 
                    <option value="">Goiás</option>
                    <option value="">Goiania</option>
                </select>
                <label for="cep">
                CEP
                </label> 
                <input type="number" id="cep" name="cep" placeholder="Digite seu CEP" pattern="[0-9]{5}-[0-9]{3}" maxlength="8" required> <!--pattern = expressão regular para validar o campo-->
                <br> <br>
                <label for="senha">
                    Senha
                </label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6" maxlength="20" required>
                <br> <br>

                <label for="telefone">
                    Telefone
                </label>
                <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                <br> <br>

                 <label for="senha">
                    Senha
                </label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6" maxlength="20" required>
                <br> <br>
        </fieldset>
      

        <fieldset style="border-color: black;">
             <legend>Alguma coisa</legend>
            <label for="url">
                URL
            </label>
            <input type="url" id="url" name="faco" placeholder="Digite a URL" required>

            <p>Sexo: </p>
            <input type="radio" id="faco" name="faco" value="faco" > 
            <label for="faco">faço</label>

            <input type="radio" id="Nfaco" name="faco" value="Nfaco" > 
            <label for="Nfaco">não faço</label> <!--name faz as labels serem do mesmo grupo-->

            <br> <br>

            <p>Assuntos de interesses:</p>

            <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
            <label for="tecnologia">Tecnologia</label>
            <br>

            <input type="checkbox" id="ciberSeguranca" name="interesses" value="ciberSeguranca">
            <label for="ciberSeguranca">CiberSegurança</label>
            <br>

            <input type="checkbox" id="cloud" name="interesses" value="cloud">
            <label for="cloud">cloud</label>
            <br>


            <label for="estadoCivil">Estado Civil</label>
            <select id="estadoCivil" name="estadoCivil"> <!--Caixinha de seleção-->
                <option value="solteiro">Solteiro</option>
                <option value="casado">Casado</option>
                <option value="divorciado">Divorciado</option>
                <option value="viuvo">Viuvo</option>
            </select>
            <br> <br>
            <br> <br>
            <input type="submit" value="Enviar"> <!--botão de envio-->
            <input type="reset" value="Limpar"> <!--botão de limpar-->
            <br> <br>
            <button type="submit">Enviar</button> 

        </fieldset> 
<br>
        <fieldset style="border-color: blueviolet;">
        <label for="observacao">Observaçoes</label>
        <textarea name="observacoes" id="observacoes" rows="5" cols="40"></textarea> <!--Limitações de linhas e colunas-->
        </fieldset>
    </form>
    
</body>
</html>
