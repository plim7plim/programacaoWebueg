<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de usuário</title>
</head>
<body>
    <h1>Cadastro de usuário</h1>
    <form>
    <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome"> <!--ID/ligação -->
        Nome Completo
        </label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" minlength="4" maxlength="50" required> <!--placeholder = dica para o usuário--> <!--minlength = tamanho mínimo--> <!--maxlength = tamanho máximo--> <!--required = obrigatório-->
        <br> <br>

        <label for="cpf">
            CPF
        </label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" inputmode="numeric" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" maxlength="14" required> <!--pattern = expressão regular para validar o campo-->
        <br> <br>

         <p>Sexo: </p>
        <input type="radio" id="Masculino" name="Masculino" value="Masculino" > 
        <label for="faco">Masculino</label>

        <input type="radio" id="feminino" name="Masculino" value="feminino" > 
        <label for="Nfaco">feminino</label> <!--name faz as labels serem do mesmo grupo-->
        <br> <br>

         <label for="estadoCivil">Estado Civil</label>
            <select id="estadoCivil" name="estadoCivil"> <!--Caixinha de seleção-->
                <option value="solteiro">Solteiro</option>
                <option value="casado">Casado</option>
                <option value="divorciado">Divorciado</option>
                <option value="viuvo">Viuvo</option>
            </select>
        <br> <br>
    </fieldset> 

    <fieldset>
        <legend>Dados de contato </legend>
        <label for="email">
                    E-mail
            </label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            <br> <br>

        <label for="website">
            website
        </label>
         <input type="url" id="site" name="site" placeholder="Digite seu sitel" required>
        <br> <br>

        <label for="Endereco"> 
                    Seu endereco
            </label>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereco" minlength="4" maxlength="500" required> 
        <br><br>

        <label for="Bairro"> 
                    Seu Bairro
            </label>
            <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro" minlength="4" maxlength="500" required>
        <br><br>

        <label for="cidade"> 
                    Sua cidade
            </label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" minlength="4" maxlength="500" required>
        <br><br>

        <label for="estado">UF</label>
            <select id="UF" name="UF"> <!--Caixinha de seleção-->
                <option value=null></option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
            </select>
        <br> <br>

        <label for="cep">
                CEP
                </label> 
                <input type="number" id="cep" name="cep" placeholder="Digite seu CEP" pattern="[0-9]{5}-[0-9]{3}" maxlength="8" required> <!--pattern = expressão regular para validar o campo-->
                <br> <br>

    </fieldset>

    <fieldset>
        <legend>Dados de cadastro</legend>

        <label for="Login"> 
                    Login:
            </label>
            <input type="text" id="Login" name="Login" placeholder="Digite seu login" minlength="4" maxlength="500" required>
        <br><br>

        <label for="senha">
                    Senha
                </label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6" maxlength="20" required>
                <br> <br>

        <b><p>Deseja receber informações sobre:</p></b>

            <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
            <label for="tecnologia">tecnologia</label>

            <input type="checkbox" id="esportes" name="interesses" value="esportes">
            <label for="esportes">esportes</label>

            <input type="checkbox" id="automoveis" name="interesses" value="automoveis">
            <label for="automoveis">automoveis</label>


            <input type="checkbox" id="culinaria" name="interesses" value="culinaria">
            <label for="culinaria">Culinária</label>
           

            <input type="checkbox" id="politica" name="interesses" value="politica">
            <label for="politica">Política</label>
          

            <input type="checkbox" id="tempo" name="interesses" value="tempo">
            <label for="tempo">Tempo</label>
            <br>

            <input type="checkbox" id="cultura" name="interesses" value="cultura">
            <label for="cultura">Cultura</label>
            

            <input type="checkbox" id="economia" name="interesses" value="economia">
            <label for="economia">Economia</label>
           
            <input type="checkbox" id="jogos" name="interesses" value="jogos">
            <label for="jogos">Jogos</label>
        

            <input type="checkbox" id="educacao" name="interesses" value="educacao">
            <label for="educacao">Educação</label>
         

            <input type="checkbox" id="viagem" name="interesses" value="viagem">
            <label for="viagem">Viagem</label>
       
            <input type="checkbox" id="empregos" name="interesses" value="empregos">
            <label for="empregos">Empregos</label>
           

            <input type="checkbox" id="modaEstilo" name="interesses" value="moda/estilo">
            <label for="modaEstilo">Moda/Estilo</label>
            <br>

            <input type="checkbox" id="aceiteRegras" name="aceiteRegras" required>
            <label for="aceiteRegras">Li as regras de cadasdtro e aceito a criaçãp de usuário</label>
            <br>
    </fieldset>
    <input type="submit" value="Cadastrar"> <!--botão de envio-->
    <input type="reset" value="Limpar"> <!--botão de limpar-->
    </form>
</body>
</html>
