<!DOCTYPE html> <!-- Declara HTML5 -->

<!-- Raiz; o ideal seria lang="pt-br" -->
<html lang="en">

<head>
    <meta charset="UTF-8"> <!-- aceita acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- responsivo -->
    <title>Document</title> <!-- título da aba -->
</head>

<body>

    <h1>Cadastro usuário</h1> <!-- título principal -->

    <!-- action = para onde envia (esta mesma página)
         method="post" = dados vão escondidos, não aparecem na URL -->
    <form action="index2.html" method="post">

        <!-- caixa com borda preta (CSS inline) -->
        <fieldset style="border-color: black;">

            <legend>Dados pessoais</legend> <!-- título da caixa -->

            <!-- for="nome" liga com id="nome" -->
            <label for="nome">Nome Completo</label>
            <!-- placeholder = dica | minlength = mínimo | maxlength = máximo | required = obrigatório -->
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" minlength="4" maxlength="50" required>

            <br><br>

            <label for="email">E-mail</label>
            <!-- type="email" valida o @ -->
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <br><br>

            <label for="data">Data de Nascimento</label>
            <!-- type="date" = calendário -->
            <input type="date" id="data" name="data" required>

            <br><br>

        </fieldset>

        <br>

        <!-- submit = envia (value = texto do botão) | reset = apaga tudo que foi digitado -->
        <input type="submit" value="Cadastrar">
        <input type="reset" value="Limpar">

        <br><br>

    </form>

</body>

</html>
