<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Situação do Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Atividade 2 - Situação do Aluno</h1>

    <form id="formAluno">
        <label for="nome">Nome do aluno:</label>
        <input type="text" id="nome" required>
        <br><br>

        <label for="nota1">Primeira nota (0 a 10):</label>
        <input type="number" id="nota1" min="0" max="10" step="any" required>
        <br><br>

        <label for="nota2">Segunda nota (0 a 10):</label>
        <input type="number" id="nota2" min="0" max="10" step="any" required>
        <br><br>

        <button type="submit">Calcular situação</button>
    </form>

    <p id="resultado" aria-live="polite"></p>

    <!-- O JavaScript fica em arquivo separado. -->
    <script src="script.js"></script>
</body>
</html>
